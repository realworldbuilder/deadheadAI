name: ShakedownAI
options:
  bundleIdPrefix: com.shakedown
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    # CI overrides CURRENT_PROJECT_VERSION per build; bump MARKETING_VERSION for releases.
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    # Automatic signing for device installs; simulator builds pass
    # CODE_SIGNING_ALLOWED=NO on the command line instead.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: R2C4T4N7US
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  ShakedownAI:
    type: application
    platform: iOS
    sources:
      - ShakedownAI
    configFiles:
      Debug: Config/Shared.xcconfig
      Release: Config/Shared.xcconfig
    entitlements:
      path: ShakedownAI/App/ShakedownAI.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        # CloudKit sync of shelves & journal. The container must exist on the
        # developer portal and be assigned to the com.deadhead.ai app ID.
        com.apple.developer.icloud-container-identifiers: [iCloud.com.deadhead.ai]
        com.apple.developer.icloud-services: [CloudKit]
        # Export re-signing flips this to production for TestFlight/App Store.
        aps-environment: development
    info:
      path: ShakedownAI/App/Info.plist
      properties:
        CFBundleDisplayName: Deadhead AI
        UILaunchScreen: {}
        # remote-notification lets CloudKit push wake sync.
        UIBackgroundModes: [audio, remote-notification]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconName: AppIcon
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        OpenAIAPIKey: $(OPENAI_API_KEY)
    settings:
      base:
        # Must match the App Store Connect app record ("Deadhead AI").
        PRODUCT_BUNDLE_IDENTIFIER: com.deadhead.ai
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      testTargets: [ShakedownAITests]
  ShakedownAITests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ShakedownAITests
    dependencies:
      - target: ShakedownAI
