# The Nethead notesfile: one Worker on the free tier serves the HTML pages,
# the static folder (style.css, deck.js, bus.js, icon) and the JSON the deck
# and the passkey ceremonies need. Two D1 databases: the catalog (replaced
# wholesale by `make d1` in tools/catalog-pipeline) and the notes (users,
# passkeys, notes, tape lists, trees, the lot — migrated in ./migrations).
name = "nethead"
main = "src/index.tsx"
compatibility_date = "2025-09-01"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "CATALOG"
database_name = "nethead-catalog"
database_id = "cb75790b-d372-4c95-b676-53fecbecb33f"   # npx wrangler d1 create nethead-catalog

[[d1_databases]]
binding = "NOTES"
database_name = "nethead-notes"
database_id = "16a9318b-8f34-444c-9111-c98c7f7e072e"     # npx wrangler d1 create nethead-notes
migrations_dir = "migrations"

[triggers]
crons = ["17 */6 * * *"]

[vars]
RP_NAME = "Nethead"
# Comma-separated handles that get the back room, before any head has role=admin.
ADMIN_HANDLES = "SHAKEDOWN::OG"
# "fts" uses the FTS5 index; "like" scans web_search_blob (the fallback if
# remote D1 ever refuses the contentless FTS5 table).
SEARCH_MODE = "fts"

[observability]
enabled = true
